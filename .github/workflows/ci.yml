name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: astrbot_plugin_command_helper

jobs:
  quality:
    name: Lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: astrbot_plugin_command_helper
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: astrbot_plugin_command_helper/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: git show --check --oneline HEAD
      - run: python scripts/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-package
          path: |
            astrbot_plugin_command_helper/dist/*.zip
            astrbot_plugin_command_helper/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  framework:
    name: AstrBot ${{ matrix.astrbot }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - astrbot: '4.27.3'
            ref: 19c029e36da451e4bef15a1adecba89dcef5e008
          - astrbot: '4.28.0'
            ref: a412146401426c0cdff8bbefb8627a03da519da8
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci/astrbot
      ASTRBOT_ROOT: ${{ github.workspace }}/.ci/data-${{ matrix.astrbot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: astrbot_plugin_command_helper
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.ref }}
          path: .ci/astrbot
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            astrbot_plugin_command_helper/requirements-dev.txt
            astrbot_plugin_command_helper/tests/requirements-framework.txt
      - run: python -m pip install -r requirements-dev.txt -r tests/requirements-framework.txt
      - name: Verify framework version
        env:
          EXPECTED_ASTRBOT: ${{ matrix.astrbot }}
        run: |
          python -c 'import os, astrbot; assert astrbot.__version__ == os.environ["EXPECTED_ASTRBOT"]'
      - name: Test standalone commands
        env:
          PHCRAFT_SOURCE: ''
        run: python -m pytest -q --ignore=tests/test_phcraft_framework.py --junitxml=test-results/core.xml
      - name: Reject skipped tests
        shell: python
        run: |
          from xml.etree import ElementTree
          report = ElementTree.parse("test-results/core.xml")
          assert not report.findall(".//skipped"), "CI must not skip tests"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-results-${{ matrix.astrbot }}
          path: astrbot_plugin_command_helper/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
